<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cofre Tech - Guilherme</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="matrix"></canvas>

    <div class="container">
        <h1>SISTEMA DE MONITORAMENTO V.2.0</h1>
        
        <div class="monitoramento">
            <div class="card">
                <p>CPU: RYZEN 5 4500</p>
                <div class="barra-fundo"><div id="cpu-bar" class="barra-progresso"></div></div>
            </div>
            <div class="card">
                <p>GPU: GTX 1060 6GB</p>
                <div class="barra-fundo"><div id="gpu-bar" class="barra-progresso"></div></div>
            </div>
        </div>

        <hr class="linha">

        <div class="ferramentas">
            <div class="box">
                <h3>GERADOR DE CHAVES</h3>
                <p id="senha-gerada">########</p>
                <button onclick="gerarSenha()">GERAR SENHA</button>
            </div>

            <div class="box">
                <h3>SCANNER DE SISTEMA</h3>
                <button onclick="fazerScan()">INICIAR SCAN</button>
                <div id="resultado-scan">Aguardando...</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
