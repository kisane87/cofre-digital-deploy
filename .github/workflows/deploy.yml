name: Deploy Cofre Digital
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker Image
        run: |
          docker build -t cofre-digital -f docker/Dockerfile .
      - name: Security Check
        run: echo 'Verificando segredos...' && echo 'Senhas protegidas com sucesso!'
